<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>YUVA Education AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
}

header{
  background:#172033;
  color:white;
  text-align:center;
  padding:22px 15px;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:6px 0 0;
  opacity:.8;
}

.container{
  width:95%;
  max-width:850px;
  margin:20px auto;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

#status{
  font-weight:bold;
  margin-bottom:10px;
}

#chat{
  height:430px;
  overflow-y:auto;
  padding:10px;
}

.msg{
  padding:12px 15px;
  border-radius:15px;
  margin:10px 0;
  line-height:1.5;
  white-space:pre-wrap;
}

.user{
  background:#172033;
  color:white;
  margin-left:12%;
}

.ai{
  background:#eef3ff;
  margin-right:12%;
}

.input-row{
  display:flex;
  gap:8px;
}

input{
  flex:1;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 16px;
  background:#172033;
  color:white;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.tool{
  background:white;
  color:#172033;
  border:1px solid #ddd;
}

.progress{
  width:100%;
  height:8px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

#bar{
  height:100%;
  width:0%;
  background:#172033;
}

.small{
  font-size:13px;
  color:#666;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
  <h1>🎓 YUVA Education AI</h1>
  <p>Private • Local • Education Assistant</p>
</header>

<div class="container">

<div class="card">

  <div id="status">
    🔴 AI not loaded
  </div>

  <button id="loadBtn" onclick="loadAI()">
    🧠 Load Local AI
  </button>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div id="progressText" class="small">
    First time loading may take several minutes.
  </div>

</div>

<div class="card">

  <div id="chat">

    <div class="msg ai">
      🤖 Hello Yuva!

      This AI runs locally in your browser.

      Click "Load Local AI" first.
    </div>

  </div>

  <div class="input-row">

    <input
      id="question"
      placeholder="Ask an education question..."
      onkeydown="enterSend(event)"
    >

    <button id="sendBtn" onclick="sendMessage()" disabled>
      Send
    </button>

  </div>

  <div class="tools">

    <button class="tool" onclick="startVoice()">
      🎤 Voice
    </button>

    <button class="tool" onclick="speakAnswer()">
      🔊 Speak
    </button>

  </div>

</div>

</div>

<script type="module">

import * as webllm
from "https://esm.run/@mlc-ai/web-llm";

let engine = null;
let lastAnswer = "";

const MODEL =
  "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";

const status =
  document.getElementById("status");

const loadBtn =
  document.getElementById("loadBtn");

const sendBtn =
  document.getElementById("sendBtn");

const bar =
  document.getElementById("bar");

const progressText =
  document.getElementById("progressText");

function addMessage(text,type){

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "msg " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

  return div;
}


window.loadAI = async function(){

  try{

    loadBtn.disabled = true;

    status.textContent =
      "🟡 Loading local AI...";

    progressText.textContent =
      "Downloading AI model. First time may take a while.";

    const initProgressCallback =
      (progress) => {

        if(progress.progress !== undefined){

          const percent =
            Math.round(progress.progress * 100);

          bar.style.width =
            percent + "%";

          progressText.textContent =
            progress.text || 
            ("Loading model: " + percent + "%");

        }

      };

    engine =
      await webllm.CreateMLCEngine(
        MODEL,
        {
          initProgressCallback
        }
      );

    status.textContent =
      "🟢 Local AI Ready";

    progressText.textContent =
      "AI model loaded on this browser.";

    sendBtn.disabled = false;

    loadBtn.textContent =
      "✅ AI Loaded";

  }catch(error){

    console.error(error);

    status.textContent =
      "🔴 AI loading failed";

    progressText.textContent =
      error.message;

    loadBtn.disabled = false;

    alert(
      "Local AI could not start. " +
      "Make sure you are using a recent Chrome browser with WebGPU enabled."
    );

  }

};


window.sendMessage = async function(){

  if(!engine){

    alert("First click Load Local AI.");

    return;
  }

  const input =
    document.getElementById("question");

  const question =
    input.value.trim();

  if(!question) return;

  input.value = "";

  addMessage(
    "👤 " + question,
    "user"
  );

  const aiMessage =
    addMessage(
      "🤖 Thinking...",
      "ai"
    );

  sendBtn.disabled = true;

  try{

    const messages = [

      {
        role:"system",

        content:
        `You are YUVA Education AI.

Your purpose is education only.

Answer questions clearly and accurately.

Explain difficult topics step by step.

For mathematics, show the calculation.

For programming, provide correct examples.

If you are unsure about an answer, say that you are unsure instead of inventing information.

Do not pretend to know something you do not know.

Use simple language when possible.`
      },

      {
        role:"user",
        content:question
      }

    ];

    const reply =
      await engine.chat.completions.create({

        messages:messages,

        temperature:0.2,

        max_tokens:700

      });

    lastAnswer =
      reply.choices[0].message.content;

    aiMessage.textContent =
      "🤖 " + lastAnswer;

  }catch(error){

    aiMessage.textContent =
      "❌ Error: " + error.message;

  }

  sendBtn.disabled = false;

};


window.enterSend = function(event){

  if(event.key === "Enter"){

    sendMessage();

  }

};


window.startVoice = function(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice recognition is not supported in this browser."
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";

  recognition.start();

  status.textContent =
    "🎤 Listening...";

  recognition.onresult =
    function(event){

      const text =
        event.results[0][0].transcript;

      document.getElementById(
        "question"
      ).value = text;

      status.textContent =
        "🟢 Voice received";

      sendMessage();

    };

  recognition.onerror =
    function(){

      status.textContent =
        "🟢 Local AI Ready";

    };

};


window.speakAnswer = function(){

  if(!lastAnswer){

    alert("There is no answer to speak yet.");

    return;
  }

  const speech =
    new SpeechSynthesisUtterance(
      lastAnswer
    );

  speech.lang = "en-IN";

  window.speechSynthesis.speak(
    speech
  );

};

</script>

</body>
</html>
